<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bestell App</title>
        <link rel="icon" type="image/svg+xml" href="./assets/icon/page-logo.svg" />
        <link rel="stylesheet" href="./styles/root.css" />
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./styles/menu.css" />
        <link rel="stylesheet" href="./styles/navigation.css" />
        <link rel="stylesheet" href="./styles/basket.css" />
        <link rel="stylesheet" href="./styles/cards.css" />
        <link rel="stylesheet" href="./styles/dialog.css" />
        <link rel="stylesheet" href="./styles/footer.css" />
        <!-- responsive.css must stay last so its media queries win -->
        <link rel="stylesheet" href="./styles/responsive.css" />
        <script src="./scripts/db.js"></script>
        <script src="./scripts/templates.js"></script>
        <script src="./script.js" defer></script>
    </head>
    <body onload="init()">
        <header class="site-header">
            <img src="./assets/icon/site-logo.svg" alt="Website Icon" />
            <img src="./assets/icon/menu.svg" alt="Menu Icon" />
        </header>
        <main>
            <section class="hero-section"></section>
            <section class="title-section">
                <img
                    src="./assets/icon/logo-burgerkitten.svg"
                    alt="Logo Burgerkitten"
                />
                <div class="restaurant">
                    <div class="name-wrapper">
                        <h1><span class="name-accent">Burger</span>Kitten</h1>
                        <div class="stars">
                            <img src="./assets/icon/star.svg" alt="Star icon" />
                            <p>4,1 <span class="rating-count">(333)</span></p>
                        </div>
                    </div>
                    <p>
                        Burgers, pizza & greens – Purrfectly stacked,
                        deliciously yours.
                    </p>
                </div>
            </section>
            <nav id="navigation" class="navigation"></nav>
            <section class="menu-section">
                <div id="menu"></div>
                <div class="basket-column">
                    <section id="basket" class="basket"></section>
                </div>
            </section>
            <dialog id="finished_order_dialog" class="order-confirmed-dialog" onclick="closeOnBackdrop(event)">
                <button
                    class="dialog-close"
                    onclick="closeDialog()"
                    aria-label="Close"
                >
                    ✕
                </button>
                <img src="./assets/icon/delivery.svg" alt="Icon of driving truck">
                <h3>Order confirmed!</h3>
                <p>Your food is on the way, meow!</p>
            </dialog>
        </main>
        <footer class="mobile-footer">
            <a href="#" aria-label="Back to top"><img src="./assets/icon/home.svg" alt=""></a>
            <a href=""><img src="./assets/icon/person.svg" alt=""></a>
            <a href=""><img src="./assets/icon/takeout_dining.svg" alt=""></a>
            <button onclick="toggleBasket()" aria-label="Open basket">
                <img src="./assets/icon/shopping-cart.svg" alt="" />
                <span id="basket-count" class="basket-badge">0</span>
            </button>
        </footer>
        <footer class="site-footer">
            <a href="">© 2026 BurgerKitten</a>
            <a href="./imprint.html">Imprint</a>
            <a href="">Cookie Preferences</a>
        </footer>
    </body>
</html>

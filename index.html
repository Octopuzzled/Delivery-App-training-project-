<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bestell App</title>
        <link rel="stylesheet" href="style.css" />
        <script src="./script.js"></script>
    </head>
    <body>
        <header class="site-header">
            <img src="./assets/icon/" alt="Website Icon" />
            <img src="" alt="Menu Icon" />
        </header>
        <main>
            <section class="hero-section"></section>
            <section class="title-section">
                <img
                    src="./assets/icon/logo-burgerkitten.svg"
                    alt="Logo Burgerkitten"
                />
                <div class="restaurant">
                    <h1>BurgerKitten</h1>
                    <div class="stars">
                        <img src="./assets/icon/star.svg" alt="Star icon" />
                        <p>4,1 (333)</p>
                    </div>
                    <p>
                        Burgers, pizza & greens – Purrfectly stacked,
                        deliciously yours.
                    </p>
                </div>
            </section>
            <section class="menu-section">
                <div class="category-header">
                    <img src="./assets/icon/burger.svg" alt="Burger icon" />
                    <h2>Burger & Sandwiches</h2>
                </div>
                <div class="menu-cards">
                    <div class="card">
                        <img
                            src="./assets/img/burger1.jpg"
                            alt="Example Picture"
                        />
                        <div class="details">
                            <div class="details-header">
                                <h3>Veggie mushroom black burger</h3>
                                <p>16,90€</p>
                            </div>

                            <p>Description about the dish</p>
                            <button class="button-to-basket">
                                Add to basket
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>

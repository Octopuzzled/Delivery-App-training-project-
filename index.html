<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>
</head>
<body>
    <header class="site-header">
        <img src="./assets/icon/" alt="Website Icon">
        <img src="" alt="Menu Icon">
    </header>
    <main>
        <section class="hero-section"></section>
        <section class="title-section"></section>
        <section class="menu-section">
            <div class="category-header">
                <img src="" alt="">
                <h2>Burger & Sandwiches</h2>
            </div>
            <div class="menu-cards">
                <div class="card">
                    <img src="" alt="Example Picture">
                    <div class="details">
                        <h3>Veggie mushroom black burger</h3>
                        <p>16,90€</p>
                        <p>Description about the dish</p>
                        <button class="button-to-basket">Add to basket</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
